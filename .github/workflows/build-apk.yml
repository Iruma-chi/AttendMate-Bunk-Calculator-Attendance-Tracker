name: Build AttendCompanion APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Set app name
        shell: bash
        run: |
          sed -i 's/manifestPlaceholders\["appName"\] = "AttendMate"/manifestPlaceholders["appName"] = "AttendCompanion"/' android/app/build.gradle.kts
          sed -i 's/manifestPlaceholders\["appName"\] = "AttendMate - Debug"/manifestPlaceholders["appName"] = "AttendCompanion"/' android/app/build.gradle.kts

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Locate APK
        shell: bash
        run: |
          set -e

          APK_PATH="$(find "$GITHUB_WORKSPACE/.." -type f -name 'app-debug.apk' -print -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "APK was not found."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$APK_PATH" "$GITHUB_WORKSPACE/artifacts/AttendCompanion-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AttendCompanion-debug-APK
          path: artifacts/AttendCompanion-debug.apk
          retention-days: 7
